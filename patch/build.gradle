plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group   = 'net.playcdu.dp2patch'
base { archivesName = "dp2patch-${minecraft_version}" }

java {
    // Forge 1.20.1 targets Java 17 bytecode. The resulting jar runs unchanged on a Java 21 server,
    // which is what this patch is built for - Java 21 simply is not the bytecode level Forge 47 loads.
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
}

mixin {
    add sourceSets.main, 'dp2patch.refmap.json'
    config 'dp2patch.mixins.json'
}

repositories {
    mavenCentral()
    // Supplies the Dimensional Pockets II and Cosmos Library jars we compile against. Neither is
    // redistributed by this repository - the build fetches them, exactly as a server owner does.
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Compile-time only - never bundled into our jar, resolved from the real mods at runtime.
    // These are the published (SRG-mapped) jars and deliberately NOT deobfuscated: every member we
    // touch is declared by the mods themselves, and Forge leaves mod-owned names untouched, so the
    // signatures are identical in both mappings.
    compileOnly "maven.modrinth:dimensional-pockets-ii:${dp2_version}"
    compileOnly "maven.modrinth:cosmos-library:${cosmoslibrary_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        minecraft_version: minecraft_version, forge_version: forge_version,
        mod_version: mod_version, mod_id: mod_id, mod_name: mod_name
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'     : mod_id,
            'Specification-Vendor'    : 'playcdu',
            'Specification-Version'   : '1',
            'Implementation-Title'    : mod_name,
            'Implementation-Version'  : project.version,
            'Implementation-Vendor'   : 'playcdu',
            'MixinConfigs'            : 'dp2patch.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}
